name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
      # End-to-end functional regression: exercises the built CLI/server
      # tools directly (npm run smoke) and the built MCP server over the
      # real stdio protocol (npm run smoke:mcp), catching breaks that unit
      # tests against source, not the built dist/, wouldn't.
      - run: npm run smoke
      - run: npm run smoke:mcp

  efficacy-regression:
    runs-on: ubuntu-latest
    # Runs assay's efficacy check (github.com/AIStoryHub/assay) across every
    # register tracked in efficacy-baselines.json, at this commit's own SHA,
    # and reports whether any register's pooled AUC dropped below its last
    # known-good value. See scripts/check-efficacy-regression.mjs's own
    # header for the full design (deterministic comparison, no tolerance
    # margin needed for that reason, non-blocking until this check has an
    # established track record). Mirrors the CircleCI job of the same name.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-efficacy-regression.mjs --ref "$ETINCEL_REF"
        env:
          # For pull_request events, github.sha is a synthetic merge commit,
          # not the PR's own head, use the PR head SHA when present, the
          # same reasoning documented in scripts/check-efficacy-regression.mjs.
          ETINCEL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
