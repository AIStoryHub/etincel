name: Publish

on:
  push:
    tags: ["v*"] # e.g. v0.9.2 — must match the version in package.json and server.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npm run smoke
          npm run smoke:mcp

      ### Publish underlying npm package:

      - name: Publish package to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      ### Publish MCP server entry:

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # DNS auth, not OIDC: this server's namespace is the domain-owned
      # "ai.etincel/*", not "io.github.<org>/*" — GitHub Actions OIDC tokens
      # only ever grant publish rights to io.github.<repository owner>/*, so
      # OIDC can't authorize this namespace regardless of workflow config.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain etincel.ai --private-key ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
