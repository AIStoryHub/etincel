version: 2.1

# Mirrors .github/workflows/ci.yml and lint.yml, plus a validation pass on
# orb.yml (the CircleCI equivalent of action.yml: a packaged, distributable
# way for other projects to add Étincel's lint to their own pipeline).

executors:
  node:
    docker:
      - image: cimg/node:20.20

commands:
  install:
    description: "Install npm dependencies, with caching."
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  test:
    executor: node
    steps:
      - checkout
      - install
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
      # End-to-end functional regression: exercises the built CLI/server
      # tools directly (npm run smoke) and the built MCP server over the
      # real stdio protocol (npm run smoke:mcp), catching breaks that unit
      # tests against source, not the built dist/, wouldn't.
      - run:
          name: "Smoke test (CLI tools end-to-end)"
          command: npm run smoke
      - run:
          name: "Smoke test (MCP server over stdio)"
          command: npm run smoke:mcp

  lint-prose:
    executor: node
    steps:
      - checkout
      - install
      - run: npm run build
      # Dogfoods this repo's own CLI against its own prose (README.md, the
      # same scope as .github/workflows/lint.yml). Non-blocking for the same
      # reason that workflow uses continue-on-error: true, this exists to
      # surface findings, not to gate merges on prose that hasn't been
      # cleaned up against it yet.
      - run:
          name: "Étincel self-lint (README)"
          command: node dist/cli.js lint README.md --threshold orange || true

  validate-orb:
    executor: node
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | bash
      - run:
          name: Validate orb.yml
          command: |
            if [ -z "$CIRCLE_TOKEN" ]; then
              echo "No CIRCLE_TOKEN project environment variable is set, so this check is skipped."
              echo "'circleci orb validate' calls the CircleCI API and needs a token: create one at"
              echo "https://app.circleci.com/settings/user/tokens and add it as CIRCLE_TOKEN under"
              echo "Project Settings > Environment Variables to turn this into a real check."
              exit 0
            fi
            circleci orb validate orb.yml

  efficacy-regression:
    description: >
      Runs assay's efficacy check (github.com/AIStoryHub/assay) across every
      register tracked in efficacy-baselines.json, at this commit's own SHA,
      and reports whether any register's pooled AUC dropped below its last
      known-good value. See scripts/check-efficacy-regression.mjs's own
      header for the full design (deterministic comparison, no tolerance
      margin needed for that reason, non-blocking until this check has an
      established track record, the same reasoning lint-prose already
      documents for itself).
    executor: node
    steps:
      - checkout
      - run:
          name: "Efficacy regression check (non-blocking)"
          command: node scripts/check-efficacy-regression.mjs --ref "$CIRCLE_SHA1"
          no_output_timeout: 15m

workflows:
  ci:
    jobs:
      - test
      - lint-prose
      - validate-orb
      - efficacy-regression
